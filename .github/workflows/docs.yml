name: Deploy Docs

# Builds the playground from main and the Starlight docs site, then deploys both to gh-pages:
# the docs at the root and the playground at /playground/. PR previews live under pr-preview/,
# which pr-preview.yml owns, so this deploy leaves that tree alone.
#
# Both builds run in one job on purpose. Vite's tsconfig discovery walks up from docs/ to the
# repo root tsconfig.json, which extends the generated .svelte-kit/tsconfig.json, so the docs
# build needs the root install (its prepare script runs `svelte-kit sync`) to have happened in
# the same workspace.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build playground
        # Never pass VITE_PLAYGROUND_ROBOTS here: Vite inlines it, so its API keys would ship in
        # the public bundle.
        env:
          BASE_PATH: /test-widgets/playground
        run: pnpm vite-build

      - name: Install docs deps
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Stage playground build under docs
        run: |
          rm -rf docs/public/playground
          cp -R build docs/public/playground

      - name: Build docs site
        working-directory: docs
        env:
          DOCS_BASE: /test-widgets/
          DOCS_SITE: https://viamrobotics.github.io
        run: pnpm build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/dist
          branch: gh-pages
          # `_app/immutable` names each chunk by content hash, so a merging deploy would keep every
          # build's chunks forever.
          clean: true
          clean-exclude: pr-preview/**
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
          commit-message: 'docs: deploy ${{ github.sha }}'
