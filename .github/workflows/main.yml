name: Main

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  deploy-and-publish:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.1
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install and Build 🔧
        run: |
          pnpm i
          pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        id: version
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Published version: $VERSION"

  bump-app-catalog:
    needs: deploy-and-publish
    if: needs.deploy-and-publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.deploy-and-publish.outputs.version }}

    steps:
      - name: Generate app repo token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_GITHUB_APP_PRIVATE_KEY }}
          owner: viamrobotics
          repositories: app

      - name: Checkout viamrobotics/app
        uses: actions/checkout@v6
        with:
          repository: viamrobotics/app
          token: ${{ steps.app-token.outputs.token }}
          path: app

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: app/package.json
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Bump @viamrobotics/test-widgets in pnpm-workspace.yaml
        working-directory: app
        run: |
          sed -i "s|\(['\"]\?@viamrobotics/test-widgets['\"]\?:\s*\).*|\1${VERSION}|" pnpm-workspace.yaml
          grep "@viamrobotics/test-widgets" pnpm-workspace.yaml

      - name: pnpm install
        working-directory: app
        run: pnpm install

      - name: Type check workspaces
        working-directory: app
        run: pnpm -r --if-present check

      - name: Run tests
        working-directory: app
        run: pnpm test

      - name: Open bump PR
        uses: peter-evans/create-pull-request@v8
        with:
          path: app
          token: ${{ steps.app-token.outputs.token }}
          branch: bump/test-widgets-${{ env.VERSION }}
          delete-branch: true
          base: main
          commit-message: 'chore: bump test-widgets to ${{ env.VERSION }}'
          title: 'chore: bump test-widgets to ${{ env.VERSION }}'
          body: |
            Automated bump of `@viamrobotics/test-widgets` to `${{ env.VERSION }}` following a release in [viamrobotics/test-widgets](https://github.com/viamrobotics/test-widgets/releases).

            Generated by the `Main` workflow on test-widgets.
